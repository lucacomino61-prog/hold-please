<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hold Please — wrong extension</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #1b2432; color: #f4f1ea; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 1rem; }
      .card { display: grid; gap: .6rem; max-width: 28rem; }
      .eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: #f2a93b; font-weight: 700; }
      h1 { margin: 0; font-family: Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(3rem, 12vw, 6rem); line-height: .9; }
      p { margin: 0; line-height: 1.4; color: #cfd6e4; }
      a { display: inline-block; margin-top: .6rem; padding: .8rem 1.4rem; border-radius: 999px; background: #f2a93b; color: #1b1510; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Sunrise Customer Care · switchboard</div>
      <h1>404</h1>
      <p>The extension you dialled does not exist. It never did. Mr. Krull has been informed and is not pleased.</p>
      <a href="/">Back to the floor</a>
    </main>
  </body>
</html>
